<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meoow Secure Payment</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; connect-src 'self' https://api.meooow.tech wss://api.meooow.tech https://*.razorpay.com https://*.razorpay.in https://lumberjack.razorpay.com http: https: ws: wss: blob:; img-src 'self' blob: data: https://*.razorpay.com https://*.razorpay.in; font-src 'self' data: https://*.razorpay.com https://*.razorpay.in https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.razorpay.com https://*.razorpay.in https://cdnjs.cloudflare.com; frame-src 'self' https://*.razorpay.com https://*.razorpay.in; style-src 'self' 'unsafe-inline' https://*.razorpay.com https://*.razorpay.in https://fonts.googleapis.com;">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #ffffff !important;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      width: 100%;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .payment-wrapper {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: #ffffff;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #0f172a;
    }
    p.subtitle {
      font-size: 13px;
      color: #475569;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(2, 132, 199, 0.2);
      border-radius: 50%;
      border-top-color: #0284c7;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 13px;
      color: #475569;
      margin-bottom: 20px;
    }
    .btn-cancel {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #334155;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }
    .btn-cancel:hover {
      background: #e2e8f0;
      color: #0f172a;
      border-color: #94a3b8;
    }
    .error-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      font-weight: 500;
      text-align: left;
    }
    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="payment-wrapper" id="paymentWrapper">
    <div class="card" id="card">
      <div class="logo-badge">
        ⚡ Meoow Secure Checkout
      </div>
      <h1 id="title">Initializing Gateway</h1>
      <p class="subtitle" id="subtitle">Connecting securely to Razorpay...</p>

      <div class="error-banner" id="errorBanner"></div>

      <div id="loaderArea">
        <div class="spinner"></div>
        <div class="status-text" id="statusText">Opening payment gateway...</div>
      </div>

      <button type="button" class="btn-cancel" id="cancelBtn">Cancel & Close</button>

      <div class="security-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>256-bit SSL Encrypted • Powered by Razorpay</span>
      </div>
    </div>
  </div>

  <script>
    const cancelBtn = document.getElementById('cancelBtn');
    const statusText = document.getElementById('statusText');
    const errorBanner = document.getElementById('errorBanner');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const loaderArea = document.getElementById('loaderArea');
    const paymentWrapper = document.getElementById('paymentWrapper');

    cancelBtn.addEventListener('click', () => {
      if (window.paymentAPI) {
        window.paymentAPI.notifyDismissed();
      } else {
        window.close();
      }
    });

    function showError(msg) {
      paymentWrapper.style.display = 'flex';
      loaderArea.style.display = 'none';
      errorBanner.style.display = 'block';
      errorBanner.textContent = msg;
      title.textContent = 'Payment Incomplete';
      subtitle.textContent = 'You can retry or close this window.';
    }

    if (window.paymentAPI) {
      window.paymentAPI.onInit((options) => {
        try {
          if (typeof window.Razorpay === 'undefined') {
            showError('Payment gateway script failed to load. Please check your internet connection.');
            return;
          }

          const rzpOptions = Object.assign({}, options, {
            theme: Object.assign({
              color: '#0284c7',
              backdrop_color: '#ffffff',
            }, (options && options.theme) || {}),
            handler: function (response) {
              paymentWrapper.style.display = 'flex';
              loaderArea.style.display = 'block';
              statusText.textContent = 'Payment successful! Finalizing...';
              window.paymentAPI.notifySuccess(response);
            },
            modal: {
              ondismiss: function () {
                window.paymentAPI.notifyDismissed();
              },
              escape: true,
              backdropclose: false
            }
          });

          const rzp = new window.Razorpay(rzpOptions);

          rzp.on('payment.failed', function (resp) {
            const errorDesc = (resp && resp.error && resp.error.description) || 'Payment was declined or failed.';
            showError(errorDesc);
            window.paymentAPI.notifyFailed(errorDesc);
          });

          // Hide underlying wrapper immediately so ONLY Razorpay Checkout renders in the window
          paymentWrapper.style.display = 'none';

          rzp.open();
        } catch (err) {
          showError(err.message || 'Error opening Razorpay modal.');
          window.paymentAPI.notifyFailed(err.message || 'Error opening Razorpay modal');
        }
      });
    } else {
      showError('Payment bridge not initialized.');
    }
  </script>
</body>
</html>
